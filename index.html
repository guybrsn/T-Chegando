<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TáChegando – Protótipo</title>
<style>
:root{--k:#000;--w:#fff;--y:#FFD60A;--m:#FF2E93;--b:#5B8CFF;--g:#00D26A;--o:#FF6A13;--bg:#D6D6D2;--a:var(--y)}
body.res{--a:var(--m)}body.ent{--a:var(--b)}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--k);font:600 16px/1.4 "Helvetica Neue",Arial,sans-serif}
h1,h2,h3,.btn,.tab,.tag{font-family:"Arial Black",Impact,sans-serif;text-transform:uppercase}
header{background:var(--k);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-bottom:8px solid var(--o)}
h1{margin:0;color:var(--y);font-size:32px;letter-spacing:-.04em}
nav{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:var(--k);color:var(--w);border:3px solid var(--w);padding:8px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--a);color:var(--k);border-color:var(--a)}
main{max-width:760px;margin:24px auto;padding:0 14px;display:grid;gap:24px}
.box{background:var(--w);border:4px solid var(--k);box-shadow:8px 8px 0 var(--k);padding:18px}
.box>h2{margin:-18px -18px 16px;padding:10px 18px;background:var(--a);border-bottom:4px solid var(--k);font-size:20px}
h3{font-size:15px;margin:18px 0 4px}
.btn{background:var(--a);color:var(--k);border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);padding:10px 16px;cursor:pointer;font-size:14px}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn:disabled{background:#bbb;color:#666;cursor:not-allowed;box-shadow:none;transform:none}
.btn.k{background:var(--k);color:var(--w)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.w{width:100%;margin-top:16px}
.lnk{border:0;background:none;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0;color:var(--k)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rc{border:4px solid var(--k);padding:16px;text-align:left;cursor:pointer;box-shadow:6px 6px 0 var(--k);font:inherit;color:var(--k)}
.rc:active{transform:translate(6px,6px);box-shadow:none}
.rc h3{margin:0 0 6px;font-size:18px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:3px solid var(--k)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border:3px solid var(--k);background:var(--y);font:900 18px Arial,sans-serif;cursor:pointer}
.alert{border:3px solid var(--k);padding:10px 12px;margin:12px 0;background:var(--o)}
.step{border:3px solid var(--k);padding:10px 12px;margin-bottom:-3px;background:var(--w)}
.step.done{background:var(--g)}.step.now{background:var(--o)}
.tag{background:var(--k);color:var(--w);padding:2px 8px;font-size:11px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.cr{border:3px solid var(--k);padding:4px 8px;font-size:12px;background:var(--w)}.cr.on{background:var(--a)}
input[type=text],input[type=password],select{width:100%;padding:10px;border:3px solid var(--k);font:inherit;background:var(--w)}
label{display:block;margin:14px 0 4px;font-size:14px}
.chk{display:flex;gap:10px;align-items:center}
input[type=checkbox]{width:22px;height:22px;accent-color:#000}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt .btn{box-shadow:none;background:var(--w)}.opt .btn.on{background:var(--a)}
:focus-visible{outline:4px solid var(--b);outline-offset:2px}
.m{font-weight:400;font-size:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--k);color:var(--y);border:3px solid var(--y);padding:10px 16px;max-width:90vw;display:none;z-index:9}
footer{text-align:center;font-size:12px;padding:0 16px 30px}
</style>
</head>
<body>
<header><h1>TáChegando</h1><nav aria-label="Perfil"></nav></header>
<main></main>
<footer>Protótipo acadêmico · Modelagem de Sistemas · dados, restaurantes e pagamentos fictícios</footer>
<div id="toast" role="status"></div>

<script>
const R=[
 {id:1,n:'Pequi & Brasa',t:'Regional',c:'#FFD60A',m:[['Arroz com pequi',28],['Maria Isabel',32],['Farofa de banana',12]]},
 {id:2,n:'Burger do Coxipó',t:'Lanches',c:'#FF2E93',m:[['X-Bacon',26],['Batata média',14],['Refri lata',7]]},
 {id:3,n:'Peixe Pintado Express',t:'Peixes',c:'#5B8CFF',m:[['Peixe na telha',45],['Pirão',10],['Suco de caju',9]]}];
const ST=['recebido','preparando','pronto','a caminho','entregue'];
const STL=['Pedido recebido','Restaurante preparando','Pronto para entrega','Entregador a caminho','Entregue'];
const PAY={pix:'Pix',card:'Cartão',cash:'Dinheiro na entrega'};
let role='cli',scr='login',rid=1,cart={},pm='pix',fail=false,err='',tries=0,lock=0,orders=[],seq=100,cur=null,rp=1;
const off={};
const $=s=>document.querySelector(s);
const brl=n=>'R$ '+n.toFixed(2).replace('.',',');
const total=()=>Object.entries(cart).reduce((s,[i,q])=>s+R[rid-1].m[i][1]*q,0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const itemsTxt=o=>o.items.map(i=>i.q+'× '+i.n).join(', ');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}

/* ---------- Cliente ---------- */
function sLogin(){
  const left=Math.ceil((lock-Date.now())/60000);
  return `<div class="box"><h2>Entrar no TáChegando</h2>
  ${left>0?`<div class="alert">Acesso bloqueado por 15 minutos após 3 senhas erradas. Faltam ${left} min. Nenhum pedido pode ser feito agora.</div>`:err?`<div class="alert">${err}</div>`:''}
  <label for="em">E-mail</label><input type="text" id="em" value="cliente@tachegando.com">
  <label for="pw">Senha</label><input type="password" id="pw" placeholder="Digite a senha">
  <button class="btn w" data-a="login">Entrar</button>
  <p class="m">Para testar, use a senha 1234. Erre 3 vezes para ver o bloqueio. <button class="lnk" data-a="unlock">Destravar</button></p></div>`;
}
function sRest(){
  return `<div class="box"><h2>Restaurantes de Cuiabá</h2><div class="grid">${R.map(r=>`<button class="rc" style="background:${r.c}" data-a="open" data-v="${r.id}"><h3>${r.n}</h3><span class="m">${r.t}</span></button>`).join('')}</div><p class="m">Nomes e valores são exemplos fictícios.</p></div>`;
}
function sMenu(){
  const r=R[rid-1];
  return `<div class="box"><h2>${r.n}</h2><button class="lnk" data-a="back" data-v="rest">← Voltar aos restaurantes</button>
  ${r.m.map((d,i)=>{const o=off[rid+'-'+i];return `<div class="line"><div>${d[0]}<br><span class="m">${brl(d[1])}</span></div>${o?'<span class="tag">Esgotado</span>':`<div class="qty"><button data-a="sub" data-v="${i}" aria-label="Menos">−</button><span>${cart[i]||0}</span><button data-a="add" data-v="${i}" aria-label="Mais">+</button></div>`}</div>`}).join('')}
  <div class="line"><span>Carrinho: ${count()} item(ns)</span><b>${brl(total())}</b></div>
  <button class="btn w" ${count()?'':'disabled'} data-a="back" data-v="pay">Ir para o pagamento</button></div>`;
}
function sPay(){
  const r=R[rid-1];
  return `<div class="box"><h2>Pagamento</h2><button class="lnk" data-a="back" data-v="menu">← Voltar ao cardápio</button>
  ${Object.entries(cart).map(([i,q])=>`<div class="line"><span>${q}× ${r.m[i][0]}</span><span>${brl(r.m[i][1]*q)}</span></div>`).join('')}
  <div class="line"><b>Total</b><b>${brl(total())}</b></div>
  <label>Forma de pagamento</label><div class="opt">${Object.entries(PAY).map(([k,n])=>`<button class="btn sm ${pm==k?'on':''}" data-a="pm" data-v="${k}">${n}</button>`).join('')}</div>
  <label class="chk"><input type="checkbox" data-a="fail" ${fail?'checked':''}> Simular pagamento recusado (teste)</label>
  ${err?`<div class="alert">${err}</div>`:''}
  <button class="btn w" data-a="pay">Pagar e enviar pedido</button></div>`;
}
function sTrack(){
  const o=orders.find(x=>x.id==cur),s=ST.indexOf(o.status);
  return `<div class="box"><h2>Pedido #${o.id}</h2><p class="m">${R[o.rid-1].n} · ${itemsTxt(o)} · ${brl(o.total)} · ${PAY[o.pm]}</p>
  ${STL.map((t,i)=>{const d=i<s||s==4;return `<div class="step ${d?'done':i==s?'now':''}">${d?'✔ ':i==s?'▶ ':''}${t}</div>`}).join('')}
  <p class="m">Para avançar as etapas, use as abas Restaurante e Entregador.</p>
  ${s==4?'<button class="btn w" data-a="again">Fazer novo pedido</button>':''}</div>`;
}
const SCR={login:sLogin,rest:sRest,menu:sMenu,pay:sPay,track:sTrack};
const crumbs=()=>`<div class="crumbs">${Object.keys(SCR).map((s,i)=>`<span class="cr ${s==scr?'on':''}">${i+1}. ${['Login','Restaurantes','Cardápio','Pagamento','Acompanhamento'][i]}</span>`).join('')}</div>`;

/* ---------- Restaurante e entregador ---------- */
function oc(o,bt){return `<div class="line" style="align-items:flex-start"><div><b>#${o.id}</b> <span class="tag">${o.status}</span><br><span class="m">${R[o.rid-1].n}<br>${itemsTxt(o)}<br>${brl(o.total)} · ${PAY[o.pm]}</span></div>${bt||''}</div>`}
const btn=(o,t)=>`<button class="btn sm k" data-a="adv" data-v="${o.id}">${t}</button>`;
function res(){
  const r=R[rp-1],os=orders.filter(o=>o.rid==rp),nx={recebido:'Aceitar pedido',preparando:'Marcar como pronto'};
  return `<div class="box"><h2>Painel do restaurante</h2><label for="rs">Restaurante</label>
  <select id="rs" data-a="rp">${R.map(x=>`<option value="${x.id}" ${x.id==rp?'selected':''}>${x.n}</option>`).join('')}</select>
  <h3>Pedidos</h3>${os.length?os.map(o=>oc(o,nx[o.status]?btn(o,nx[o.status]):'')).join(''):'<p class="m">Nenhum pedido ainda. Faça um pedido na aba Cliente.</p>'}</div>
  <div class="box"><h2>Cardápio</h2>${r.m.map((d,i)=>{const o=off[rp+'-'+i];return `<div class="line"><span>${d[0]}<br><span class="m">${brl(d[1])}</span></span><button class="btn sm ${o?'':'k'}" data-a="tog" data-v="${i}">${o?'Esgotado':'Disponível'}</button></div>`}).join('')}</div>`;
}
function ent(){
  const av=orders.filter(o=>o.status=='pronto'),rt=orders.filter(o=>o.status=='a caminho');
  return `<div class="box"><h2>Entregas disponíveis</h2>${av.length?av.map(o=>oc(o,btn(o,'Aceitar entrega'))).join(''):'<p class="m">Nenhuma entrega pronta. O restaurante precisa marcar o pedido como pronto.</p>'}</div>
  <div class="box"><h2>Em rota</h2>${rt.length?rt.map(o=>oc(o,btn(o,'Confirmar entrega'))+'<p class="m">Destino: Av. Getúlio Vargas, 500 (exemplo)</p>').join(''):'<p class="m">Nenhuma entrega em andamento.</p>'}</div>`;
}

/* ---------- Controle ---------- */
function render(){
  document.body.className=role;
  $('nav').innerHTML=[['cli','Cliente'],['res','Restaurante'],['ent','Entregador']].map(([k,n])=>`<button class="tab ${role==k?'on':''}" data-a="role" data-v="${k}">${n}</button>`).join('');
  $('main').innerHTML=role=='cli'?crumbs()+SCR[scr]():role=='res'?res():ent();
}
function act(a,v){
  if(a=='role')role=v;
  else if(a=='login'){
    if(Date.now()>=lock){
      if($('#pw').value=='1234'){tries=0;err='';scr='rest'}
      else{tries++;if(tries>=3){lock=Date.now()+9e5;tries=0;err=''}else err='Senha incorreta. Tentativa '+tries+' de 3.'}
    }
  }
  else if(a=='unlock'){lock=0;tries=0;err=''}
  else if(a=='open'){rid=+v;cart={};err='';scr='menu'}
  else if(a=='back'){scr=v;err=''}
  else if(a=='add')cart[v]=(cart[v]||0)+1;
  else if(a=='sub'){if(cart[v]>1)cart[v]--;else delete cart[v]}
  else if(a=='pm'){pm=v;err=''}
  else if(a=='pay'){
    if(pm!='cash'&&fail)err='Pagamento não aprovado. O pedido não foi enviado ao restaurante. Seu carrinho foi mantido: tente de novo.';
    else{
      const o={id:++seq,rid,items:Object.entries(cart).map(([i,q])=>({n:R[rid-1].m[i][0],q})),total:total(),pm,status:'recebido'};
      orders.push(o);cur=o.id;cart={};err='';scr='track';toast('Pagamento aprovado. Pedido enviado ao restaurante.');
    }
  }
  else if(a=='adv'){const o=orders.find(x=>x.id==v);o.status=ST[ST.indexOf(o.status)+1];toast('Pedido #'+v+': '+STL[ST.indexOf(o.status)])}
  else if(a=='tog'){const k=rp+'-'+v;off[k]=!off[k]}
  else if(a=='again'){cart={};cur=null;scr='rest'}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b||['SELECT','INPUT'].includes(b.tagName))return;
  act(b.dataset.a,b.dataset.v);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a=='rp')rp=+t.value;else if(t.dataset.a=='fail')fail=t.checked;else return;
  render();
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pw')act('login')});
render();
</script>
</body>
</html>
